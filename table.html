<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceCo Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14120F;
    --paper:#F7F3EA;
    --brass:#B8843A;
    --brass-deep:#8C6425;
    --graphite:#6B655A;

    --bg: var(--paper);
    --surface: #FCFAF3;
    --fg: var(--ink);
    --muted: var(--graphite);
    --accent: var(--brass-deep);
    --rule: rgba(20,18,15,0.16);
    --bracket: rgba(20,18,15,0.55);
    --disabled-fg: rgba(20,18,15,0.38);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: var(--ink);
      --surface: #1C1913;
      --fg: var(--paper);
      --muted: #ABA192;
      --accent: #CB9A56;
      --rule: rgba(247,243,234,0.18);
      --bracket: rgba(247,243,234,0.5);
      --disabled-fg: rgba(247,243,234,0.34);
    }
  }
  :root[data-theme="dark"]{
    --bg: var(--ink);
    --surface: #1C1913;
    --fg: var(--paper);
    --muted: #ABA192;
    --accent: #CB9A56;
    --rule: rgba(247,243,234,0.18);
    --bracket: rgba(247,243,234,0.5);
    --disabled-fg: rgba(247,243,234,0.34);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:420px;
    padding:52px 24px 40px;
  }

  .bracket{ position:relative; padding:22px 18px; }
  .bracket::before, .bracket::after, .bracket .c2, .bracket .c3{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    border:2px solid var(--bracket);
  }
  .bracket::before{ top:0; left:0; border-right:none; border-bottom:none; }
  .bracket::after{ bottom:0; right:0; border-left:none; border-top:none; }
  .bracket .c2{ top:0; right:0; border-left:none; border-bottom:none; }
  .bracket .c3{ bottom:0; left:0; border-right:none; border-top:none; }

  header{
    text-align:center;
    margin-bottom:16px;
  }
  .mark{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:.01em;
    margin:0 0 6px;
  }
  .mark .bk{
    display:inline-block;
    padding:0 3px;
    border-top:2px solid var(--fg);
    border-bottom:2px solid var(--fg);
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }
  .at-table{
    margin:16px 0 0;
    font-size:13.5px;
    color:var(--muted);
  }

  .links{
    list-style:none;
    margin:32px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px;
    border:1px solid var(--rule);
    background:var(--surface);
    text-decoration:none;
    color:var(--fg);
    transition:border-color .15s ease, transform .1s ease;
  }
  .link:hover{ border-color:var(--accent); }
  .link:active{ transform:translateY(1px); }
  .link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .link-text{ display:flex; flex-direction:column; gap:2px; }
  .link-title{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .link-sub{
    font-size:12.5px;
    color:var(--muted);
  }
  .link-arrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:16px;
    color:var(--accent);
    flex:none;
  }

  .link.is-disabled{
    cursor:default;
    color:var(--disabled-fg);
    border-style:dashed;
  }
  .link.is-disabled .link-title{ color:var(--disabled-fg); }
  .link.is-disabled:hover{ border-color:var(--rule); }
  .link.is-disabled .link-arrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--disabled-fg);
  }

  footer{
    margin-top:40px;
    text-align:center;
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="page">

  <header class="bracket">
    <span class="c2"></span><span class="c3"></span>
    <p class="mark">SPACE<span class="bk">CO</span>.</p>
    <p class="eyebrow">Sherouk City &middot; Diamond Mall</p>
    <p class="at-table">At your table? Start here.</p>
  </header>

  <ul class="links">

    <li>
      <span class="link is-disabled" aria-disabled="true">
        <span class="link-text">
          <span class="link-title">Website</span>
        </span>
        <span class="link-arrow">SOON</span>
      </span>
    </li>

    <li>
      <a class="link" href="menu.html">
        <span class="link-text">
          <span class="link-title">Menu</span>
          <span class="link-sub">Coffee, tea, cold drinks &amp; snacks</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

    <li>
      <a class="link" href="https://maps.app.goo.gl/XmLYT9PPF36vhHhQ7?g_st=ic" target="_blank" rel="noopener">
        <span class="link-text">
          <span class="link-title">Add Your Review</span>
          <span class="link-sub">Via Google Maps</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

    <li>
      <a class="link" href="https://www.instagram.com/spaceco_workspace/" target="_blank" rel="noopener">
        <span class="link-text">
          <span class="link-title">Instagram</span>
          <span class="link-sub">@spaceco_workspace</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

    <li>
      <span class="link is-disabled" aria-disabled="true">
        <span class="link-text">
          <span class="link-title">Instapay</span>
        </span>
        <span class="link-arrow">SOON</span>
      </span>
    </li>

  </ul>

  <footer>SpaceCo_Workspace</footer>

</div>

</body>
</html>
