<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceCo Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14120F;
    --paper:#F7F3EA;
    --brass:#B8843A;
    --brass-deep:#8C6425;
    --graphite:#6B655A;
    --rust:#A6512D;

    --bg: var(--paper);
    --surface: #FCFAF3;
    --fg: var(--ink);
    --muted: var(--graphite);
    --accent: var(--brass-deep);
    --rule: rgba(20,18,15,0.16);
    --disabled-fg: rgba(20,18,15,0.38);

    --c-menu: var(--brass);
    --c-review: var(--graphite);
    --c-instagram: var(--rust);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: var(--ink);
      --surface: #1C1913;
      --fg: var(--paper);
      --muted: #ABA192;
      --accent: #CB9A56;
      --rule: rgba(247,243,234,0.18);
      --disabled-fg: rgba(247,243,234,0.34);

      --c-menu: #CB9A56;
      --c-review: #A79F8E;
      --c-instagram: #C97350;
    }
  }
  :root[data-theme="dark"]{
    --bg: var(--ink);
    --surface: #1C1913;
    --fg: var(--paper);
    --muted: #ABA192;
    --accent: #CB9A56;
    --rule: rgba(247,243,234,0.18);
    --disabled-fg: rgba(247,243,234,0.34);

    --c-menu: #CB9A56;
    --c-review: #A79F8E;
    --c-instagram: #C97350;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:420px;
    padding:52px 24px 40px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
  }
  .logo-wrap{
    width:220px;
    height:84px;
    overflow:hidden;
    position:relative;
    margin:0 auto 14px;
  }
  .logo-wrap img{
    position:absolute;
    left:0;
    top:-66px;
    width:220px;
    height:220px;
  }
  .logo-dark{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .logo-light{ display:none; }
    :root:not([data-theme="light"]) .logo-dark{ display:block; }
  }
  :root[data-theme="dark"] .logo-light{ display:none; }
  :root[data-theme="dark"] .logo-dark{ display:block; }

  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }

  .links{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px;
    border:1px solid var(--rule);
    background:var(--surface);
    text-decoration:none;
    color:var(--fg);
    transition:border-color .15s ease, transform .1s ease;
  }
  .link:active{ transform:translateY(1px); }
  .link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .link-text{ display:flex; flex-direction:column; gap:2px; }
  .link-title{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .link-sub{
    font-size:12.5px;
    color:var(--muted);
  }
  .link-arrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:16px;
    flex:none;
  }

  .link--menu{
    background:color-mix(in srgb, var(--c-menu) 22%, var(--surface));
    border-color:color-mix(in srgb, var(--c-menu) 45%, var(--surface));
  }
  .link--menu .link-arrow{ color:var(--c-menu); }
  .link--menu:hover{ border-color:var(--c-menu); }

  .link--review{
    background:color-mix(in srgb, var(--c-review) 22%, var(--surface));
    border-color:color-mix(in srgb, var(--c-review) 45%, var(--surface));
  }
  .link--review .link-arrow{ color:var(--c-review); }
  .link--review:hover{ border-color:var(--c-review); }

  .link--instagram{
    background:color-mix(in srgb, var(--c-instagram) 22%, var(--surface));
    border-color:color-mix(in srgb, var(--c-instagram) 45%, var(--surface));
  }
  .link--instagram .link-arrow{ color:var(--c-instagram); }
  .link--instagram:hover{ border-color:var(--c-instagram); }

  .link.is-disabled{
    cursor:default;
    color:var(--disabled-fg);
    border-style:dashed;
  }
  .link.is-disabled .link-title{ color:var(--disabled-fg); }
  .link.is-disabled .link-arrow{
    font-size:10px;
    letter-spacing:.1em;
    color:var(--disabled-fg);
  }

  footer{
    margin-top:40px;
    text-align:center;
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <div class="logo-wrap">
      <img class="logo-light" src="spaceco-logo-black.png" alt="SpaceCo Workspace" width="220" height="220">
      <img class="logo-dark" src="spaceco-logo-white.png" alt="SpaceCo Workspace" width="220" height="220">
    </div>
    <p class="eyebrow">Sherouk City &middot; Diamond Mall</p>
  </header>

  <ul class="links">

    <li>
      <span class="link is-disabled" aria-disabled="true">
        <span class="link-text">
          <span class="link-title">Website</span>
        </span>
        <span class="link-arrow">SOON</span>
      </span>
    </li>

    <li>
      <a class="link link--menu" href="menu.html">
        <span class="link-text">
          <span class="link-title">Menu</span>
          <span class="link-sub">Coffee, tea, cold drinks &amp; snacks</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

    <li>
      <a class="link link--review" href="https://maps.app.goo.gl/XmLYT9PPF36vhHhQ7?g_st=ic" target="_blank" rel="noopener">
        <span class="link-text">
          <span class="link-title">Review Us!</span>
          <span class="link-sub">Via Google Maps</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

    <li>
      <a class="link link--instagram" href="https://www.instagram.com/spaceco_workspace/" target="_blank" rel="noopener">
        <span class="link-text">
          <span class="link-title">Instagram</span>
          <span class="link-sub">@spaceco_workspace</span>
        </span>
        <span class="link-arrow">&rarr;</span>
      </a>
    </li>

  </ul>

  <footer>SpaceCo_Workspace</footer>

</div>

</body>
</html>
